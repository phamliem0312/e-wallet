spring:
  application:
    name: identity
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/identity_db
    username: identity_svc
    password: ${DB_PASSWORD:ewallet}        # "ewallet" là mật khẩu dev của docker compose
  flyway:
    locations: classpath:db/migration,classpath:db/platform
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null    # field không có giá trị thì vắng mặt, không trả null
    deserialization:
      fail-on-unknown-properties: true      # request đóng (additionalProperties: false trong hợp đồng)

server:
  port: 8101
  forward-headers-strategy: native          # IP của khách lấy từ X-Forwarded-For do gateway đặt

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0

ewallet:
  security:
    public-paths: >
      /api/v1/auth/register, /api/v1/auth/register/verify, /api/v1/auth/login, /api/v1/auth/login/verify,
      /api/v1/auth/refresh, /api/v1/auth/password/forgot, /api/v1/auth/password/reset,
      /.well-known/jwks.json, /actuator/prometheus

# Giá trị dưới đây là số minh hoạ của SRS F-ACC-01 §7, CHƯA chốt (OQ-035, OQ-036), trừ access.ttl (design §10).
auth:
  otp:
    ttl: PT3M
    max-attempts: 5
    resend-after: PT30S
    max-sends: 5
    send-window: PT1H
  login:
    max-failures: 5
    lock-duration: PT15M
  access:
    ttl: PT5M
  refresh:
    ttl: P30D
    reuse-grace: PT0S
  session:
    idle-timeout: PT30M
  password:
    min-length: 8
    max-length: 128
  terms:
    current-version: "2026-11"
  device: {}
  jwt:
    issuer: identity
    private-jwk: ${AUTH_JWT_PRIVATE_JWK:}   # JWK của khoá EC P-256 có phần riêng tư. Trống thì sinh khoá tạm (bị cấm ở prod)
  hmac-key: ${AUTH_HMAC_KEY:}               # base64, ít nhất 32 byte. Trống thì sinh khoá tạm (bị cấm ở prod)
  ratelimit:
    register-ip: { limit: 20, window: PT1M }
    login-ip: { limit: 20, window: PT1M }
    login-phone: { limit: 30, window: PT1M }
    otp-verify-ip: { limit: 30, window: PT1M }
    forgot-ip: { limit: 20, window: PT1M }
